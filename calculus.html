                tile.innerHTML = `<div class="tile-fav"><img src="${FAV(r.host)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'letter',textContent:'${(r.host||'?').charAt(0).toUpperCase()}'}))"></div><div class="tile-label">${r.host}</div>`;
                tile.addEventListener('click', () => navigate(r.url));
                recG.appendChild(tile);
            }
        }
        paintRecent();
        root.querySelector('#nt-clear-recent').addEventListener('click', () => { recent = []; save(STORAGE.recent, recent); paintRecent(); });

        t.title = 'New Tab';
        t.parts.title.textContent = t.title;
        t.parts.fav.replaceWith(buildLetter('•'));
        t.parts.fav = t.parts.el.querySelector('.tab-fav');
    }

                open.addEventListener('click', () => navigate(b.url));
                const del = document.createElement('button'); del.className = 'set-btn danger'; del.textContent = 'Delete';
                del.addEventListener('click', () => { bookmarks.splice(i, 1); save(STORAGE.bookmarks, bookmarks); renderBookmarksBar(); renderSettings(getActive(), 'bookmarks'); });
                grp.appendChild(open); grp.appendChild(del);
                r.appendChild(lbl); r.appendChild(grp);
                sec.appendChild(r);
            });
        }
        f.appendChild(sec);
        return f;
    }

    function sectionHistory() {
        const f = document.createDocumentFragment();
        f.appendChild(h2('History', `${history.length} entries.`));
        const sec = document.createElement('div'); sec.className = 'set-section';
        if (!history.length) { const e = document.createElement('div'); e.className = 'ov-empty'; e.textContent = 'No history yet.'; sec.appendChild(e); }
        else {
            history.slice(0, 100).forEach((h, i) => {
                const r = document.createElement('div'); r.className = 'set-row';
                const lbl = document.createElement('div'); lbl.className = 'lbl';
                lbl.innerHTML = `<b>${(h.title || h.url).replace(/</g,'&lt;')}</b><span>${h.url.replace(/</g,'&lt;')} · ${new Date(h.t).toLocaleString()}</span>`;
                const grp = document.createElement('div'); grp.style.display = 'flex'; grp.style.gap = '6px';
                const open = document.createElement('button'); open.className = 'set-btn'; open.textContent = 'Open';
                open.addEventListener('click', () => navigate(h.url));
                const del = document.createElement('button'); del.className = 'set-btn danger'; del.textContent = 'Forget';
                del.addEventListener('click', () => { history.splice(i, 1); save(STORAGE.history, history); renderSettings(getActive(), 'history'); });
                grp.appendChild(open); grp.appendChild(del);
                r.appendChild(lbl); r.appendChild(grp);
                sec.appendChild(r);
            });
        }
        f.appendChild(sec);
        return f;
    }

    function sectionAdvanced() {
        const f = document.createDocumentFragment();
        f.appendChild(h2('Advanced', 'Power-user controls. Asset overrides intercept proxied requests inside the SW.'));

        const ovSec = document.createElement('div'); ovSec.className = 'set-section';
        const oh = document.createElement('h3'); oh.textContent = 'Asset overrides'; ovSec.appendChild(oh);
        const desc = document.createElement('p'); desc.className = 'subtitle'; desc.style.marginBottom = '14px'; desc.textContent = 'When a page proxied through Luminal requests a URL matching the pattern, serve a replacement instead. Patterns support * wildcards (e.g. *.example.com/script.js).'; ovSec.appendChild(desc);
        const list = document.createElement('div'); list.className = 'override-list';
        function paint() {
            list.innerHTML = '';
            if (!overrides.length) { const e = document.createElement('div'); e.className = 'ov-empty'; e.textContent = 'No overrides yet.'; list.appendChild(e); return; }
            overrides.forEach((o, i) => {
                const r = document.createElement('div'); r.className = 'ov-row' + (o.enabled === false ? ' disabled' : '');
                const pat = document.createElement('input'); pat.value = o.pattern || ''; pat.placeholder = '*.example.com/path'; pat.addEventListener('change', () => { o.pattern = pat.value; save(STORAGE.overrides, overrides); pushOverridesToSW(); });
                const arrow = document.createElement('div'); arrow.className = 'arrow'; arrow.innerHTML = '<i class="fa-solid fa-arrow-right"></i>';
                const tgt = document.createElement('input'); tgt.value = o.target || ''; tgt.placeholder = o.kind === 'file' ? '(uploaded file)' : 'https://replacement-url'; tgt.disabled = o.kind === 'file'; tgt.addEventListener('change', () => { o.target = tgt.value; save(STORAGE.overrides, overrides); pushOverridesToSW(); });
                const k = document.createElement('select');
                ['url', 'file', 'block'].forEach(opt => { const op = document.createElement('option'); op.value = opt; op.textContent = opt === 'url' ? 'URL' : opt === 'file' ? 'File' : 'Block'; if (o.kind === opt) op.selected = true; k.appendChild(op); });
                k.addEventListener('change', () => { o.kind = k.value; if (o.kind === 'file' && !o.target) { pickFile(o, () => { paint(); }); } save(STORAGE.overrides, overrides); pushOverridesToSW(); paint(); });
                const x = document.createElement('button'); x.className = 'ov-x'; x.innerHTML = '<i class="fa-solid fa-times"></i>'; x.addEventListener('click', () => { overrides.splice(i, 1); save(STORAGE.overrides, overrides); pushOverridesToSW(); paint(); });
                r.appendChild(pat); r.appendChild(arrow); r.appendChild(tgt); r.appendChild(k); r.appendChild(x);
                list.appendChild(r);
            });
        }
        paint();
        const adds = document.createElement('div'); adds.className = 'ov-add';
        const addUrl = document.createElement('button'); addUrl.className = 'set-btn'; addUrl.textContent = '+ Add URL override';
        addUrl.addEventListener('click', () => { overrides.push({ pattern: '', target: '', kind: 'url', enabled: true }); save(STORAGE.overrides, overrides); paint(); });
        const addFile = document.createElement('button'); addFile.className = 'set-btn'; addFile.textContent = '+ Add file override';
        addFile.addEventListener('click', () => {
            const o = { pattern: '', target: '', kind: 'file', enabled: true, fileName: '' };
            pickFile(o, () => { overrides.push(o); save(STORAGE.overrides, overrides); paint(); pushOverridesToSW(); });
        });
        const addBlock = document.createElement('button'); addBlock.className = 'set-btn'; addBlock.textContent = '+ Add block rule';
        addBlock.addEventListener('click', () => { overrides.push({ pattern: '', target: '', kind: 'block', enabled: true }); save(STORAGE.overrides, overrides); paint(); pushOverridesToSW(); });
        adds.appendChild(addUrl); adds.appendChild(addFile); adds.appendChild(addBlock);
        ovSec.appendChild(list);
        ovSec.appendChild(adds);
        f.appendChild(ovSec);

        const expSec = document.createElement('div'); expSec.className = 'set-section';
        const eh = document.createElement('h3'); eh.textContent = 'Import / Export'; expSec.appendChild(eh);
        const ed = document.createElement('p'); ed.className = 'subtitle'; ed.style.marginBottom = '14px'; ed.textContent = 'Save bookmarks, history, pinned tiles, and overrides as a single JSON file.'; expSec.appendChild(ed);
        const ebr = document.createElement('div'); ebr.style.display = 'flex'; ebr.style.gap = '8px';
        const exp = document.createElement('button'); exp.className = 'set-btn primary'; exp.textContent = 'Export…';
        exp.addEventListener('click', () => {
            const blob = new Blob([JSON.stringify({ bookmarks, history, pinned, overrides, prefs }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `luminal-browser-${new Date().toISOString().slice(0,10)}.json`; a.click();
            URL.revokeObjectURL(a.href);
        });
        const imp = document.createElement('button'); imp.className = 'set-btn'; imp.textContent = 'Import…';
        const impFile = document.createElement('input'); impFile.type = 'file'; impFile.accept = 'application/json'; impFile.style.display = 'none';
        impFile.addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return;
            const r = new FileReader();
            r.onload = () => {
                try {
                    const d = JSON.parse(r.result);
                    if (d.bookmarks) { bookmarks = d.bookmarks; save(STORAGE.bookmarks, bookmarks); }
                    if (d.history) { history = d.history; save(STORAGE.history, history); }
                    if (d.pinned) { pinned = d.pinned; save(STORAGE.pinned, pinned); }
                    if (d.overrides) { overrides = d.overrides; save(STORAGE.overrides, overrides); pushOverridesToSW(); }
                    if (d.prefs) { prefs = Object.assign(prefs, d.prefs); save(STORAGE.prefs, prefs); applyAdsCookie(); applyBookmarksBarVisibility(); }
                    renderSettings(getActive(), 'advanced');
                } catch (err) { alert('Import failed: ' + err.message); }
            };
            r.readAsText(file);
        });
        imp.addEventListener('click', () => impFile.click());
        ebr.appendChild(exp); ebr.appendChild(imp); ebr.appendChild(impFile);
        expSec.appendChild(ebr);
        f.appendChild(expSec);
        return f;
    }

    function pickFile(o, cb) {
        const fi = document.createElement('input'); fi.type = 'file';
        fi.addEventListener('change', () => {
            const file = fi.files[0]; if (!file) return cb && cb();
            const r = new FileReader();
            r.onload = () => { o.target = r.result; o.fileName = file.name; o.mime = file.type || 'application/octet-stream'; save(STORAGE.overrides, overrides); cb && cb(); };
            r.readAsDataURL(file);
        });
        fi.click();
    }

    function pushOverridesToSW() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(regs => {
            const payload = { type: 'lumi-overrides', overrides: overrides.filter(o => o.enabled !== false && o.pattern) };
            regs.forEach(reg => {
                const sw = reg.active || reg.waiting; if (sw) try { sw.postMessage(payload); } catch {}
            });
        });
    }

    window.addEventListener('message', (e) => {
        const d = e.data; if (!d || typeof d !== 'object') return;
        if (d.type === 'lumi-open-tab' && d.url) { createTab(d.url); }
        if (d.type === 'lumi-navigate' && d.url) {
            const openNew = !!d.newTab || (d.fromSearch && prefs.searchOpensNewTab);
            if (openNew) createTab(d.url);
            else { const a = getActive(); if (a) navigateTab(a.id, d.url); else createTab(d.url); }
        }
        if (d.type === 'lumi-overrides-ready') pushOverridesToSW();
    });
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', (e) => {
            const d = e.data; if (!d) return;
            if (d.type === 'lumi-open-tab' && d.url) createTab(d.url);
            if (d.type === 'lumi-overrides-ready') pushOverridesToSW();
        });
    }
    setTimeout(pushOverridesToSW, 1500);
    setInterval(pushOverridesToSW, 30000);

    document.addEventListener('keydown', (e) => {
        const cmd = e.ctrlKey || e.metaKey;
        if (!cmd) {
            if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); backBtn.click(); }
            else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); fwdBtn.click(); }
            return;
        }
        if (e.key === 't') { e.preventDefault(); createTab(); }
        else if (e.key === 'w') { e.preventDefault(); if (activeId) closeTab(activeId); }
        else if (e.key === 'l') { e.preventDefault(); address.focus(); }
        else if (e.key === 'r') { e.preventDefault(); reloadBtn.click(); }
        else if (e.key === 'd') { e.preventDefault(); bmBtn.click(); }
        else if (e.key === ',') { e.preventDefault(); openSettingsTab(getActive()); }
    });

    function osTheme() {
        try { return localStorage.getItem('luminal_theme') || 'dark'; } catch { return 'dark'; }
    }
    function calcEffectiveTheme() {
        const mode = prefs.theme || 'auto';
        return mode === 'auto' ? (osTheme() === 'light' ? 'light' : 'dark') : mode;
    }
    function applyCalcTheme() {
        const eff = calcEffectiveTheme();
        document.documentElement.classList.toggle('theme-light', eff === 'light');
        document.documentElement.classList.toggle('theme-dark', eff === 'dark');
        document.documentElement.style.colorScheme = eff;
        document.querySelectorAll('.page iframe').forEach(f => { f.style.colorScheme = eff; });
    }
    window.addEventListener('storage', (e) => {
        if (e.key === 'luminal_theme' && (prefs.theme || 'auto') === 'auto') applyCalcTheme();
    });

    applyCalcTheme();
    applyBookmarksBarVisibility();
    renderBookmarksBar();
    createTab();
})();
</script>
</body>
</html>
