        :root {

        /* Basic setup for a full-screen, dark theme */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            animation: fadeIn 0.8s ease-out;
            padding: 20px;
        }

        h1 {
            font-size: clamp(8rem, 25vw, 15rem);
            font-weight: 700;
            margin: 0;
            color: rgba(255, 255, 255, 0.1); 
            text-shadow: 0 0 1px rgba(255, 255, 255, 0.2);
        }

        h2 {
            font-size: 1.5rem;
            margin-top: -2rem; 
            font-weight: 500;
            color: var(--accent-color);
        }

        p {
            font-size: 1rem;
            color: #a0a0a0;
            max-width: 400px;
            margin: 10px auto 30px auto;
        }

        .os-button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
            display: inline-block;
        }

        .os-button:hover {
            background-color: #5aa1f2; 
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
